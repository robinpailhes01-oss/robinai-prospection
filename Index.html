<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RobinAI Consulting — Prospection CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --ink: #0a0a0a;
      --ink-soft: #525252;
      --ink-mute: #a3a3a3;
      --line: #e5e5e0;
      --accent: #0066ff;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .display-serif { font-family: 'Fraunces', serif; font-feature-settings: "ss01", "ss02"; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .chip { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
    .status-scraped { background: #f5f5f5; color: #525252; }
    .status-enriched { background: #eef2ff; color: #4338ca; }
    .status-email_1_sent, .status-email_2_sent, .status-email_3_sent { background: #fef3c7; color: #92400e; }
    .status-email_1_opened, .status-email_2_opened, .status-email_3_opened { background: #dbeafe; color: #1e40af; }
    .status-replied { background: #d1fae5; color: #065f46; }
    .status-call_booked { background: #ede9fe; color: #6d28d9; }
    .status-client { background: #10b981; color: white; }
    .status-not_interested { background: #fee2e2; color: #991b1b; }
    .status-unsubscribed { background: #f3f4f6; color: #6b7280; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .tab-active { background: var(--ink); color: white; }
    button, select, input { outline: none; }
    .btn-primary { background: var(--ink); color: white; transition: transform 0.1s; }
    .btn-primary:hover { transform: translateY(-1px); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = 'https://utyfpmjhtfoxsxncfoxe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0eWZwbWpodGZveHN4bmNmb3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMzgzMTUsImV4cCI6MjA4OTYxNDMxNX0.OGLR8d0GOZVMM48WlhUYrGsnthaaNNxBGPUHpJoSong';

    const CATEGORY_LABELS = {
      location_bateaux_yachts: 'Location bateaux/yachts',
      jet_ski_nautique: 'Jet ski / nautique',
      plongee_snorkeling: 'Plongée / snorkeling',
      ecole_voile_surf: 'École voile / surf',
      croisiere_excursion: 'Croisière / excursion',
      autre_nautique: 'Autre nautique'
    };

    const STATUS_LABELS = {
      scraped: 'Scrapé',
      enriched: 'Enrichi IA',
      email_1_sent: 'Email 1 envoyé',
      email_1_opened: 'Email 1 ouvert',
      email_2_sent: 'Email 2 envoyé',
      email_2_opened: 'Email 2 ouvert',
      email_3_sent: 'Email 3 envoyé',
      email_3_opened: 'Email 3 ouvert',
      replied: 'Réponse reçue',
      call_booked: 'Appel réservé',
      client: 'Client',
      not_interested: 'Pas intéressé',
      unsubscribed: 'Désinscrit'
    };

    async function supabaseFetch(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    function StatusChip({ status }) {
      return <span className={`chip status-${status}`}>{STATUS_LABELS[status] || status}</span>;
    }

    function ScoreBar({ score }) {
      if (score == null) return <span className="text-xs text-neutral-400">—</span>;
      const color = score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--amber)' : 'var(--red)';
      return (
        <div className="flex items-center gap-2">
          <div className="w-16 h-1.5 bg-neutral-100 rounded-full overflow-hidden">
            <div style={{ width: `${score}%`, background: color, height: '100%' }} />
          </div>
          <span className="text-xs font-medium tabular-nums w-6 text-right">{score}</span>
        </div>
      );
    }

    function KPICard({ label, value, sublabel, accent }) {
      return (
        <div className="card p-4 sm:p-5">
          <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium">{label}</div>
          <div className="display-serif text-3xl sm:text-4xl font-light mt-1 tabular-nums" style={accent ? { color: accent } : {}}>{value}</div>
          {sublabel && <div className="text-xs text-neutral-400 mt-1">{sublabel}</div>}
        </div>
      );
    }

    function FunnelStep({ label, count, pct, isLast }) {
      return (
        <div className="flex-1 relative">
          <div className="card p-3 text-center">
            <div className="text-[10px] uppercase tracking-wider text-neutral-400 font-medium">{label}</div>
            <div className="display-serif text-2xl font-light mt-0.5 tabular-nums">{count}</div>
            <div className="text-[10px] text-neutral-400 tabular-nums">{pct.toFixed(1)}%</div>
          </div>
        </div>
      );
    }

    function ProspectRow({ prospect, onOpen }) {
      return (
        <tr onClick={() => onOpen(prospect)} className="cursor-pointer hover:bg-neutral-50 border-b border-neutral-100 transition-colors">
          <td className="px-3 sm:px-4 py-3">
            <div className="font-medium text-sm">{prospect.business_name}</div>
            <div className="text-xs text-neutral-500 mt-0.5 flex items-center gap-2 flex-wrap">
              <span>{prospect.city || '—'}</span>
              {prospect.google_rating && (
                <span className="tabular-nums">⭐ {prospect.google_rating} ({prospect.google_reviews_count || 0})</span>
              )}
            </div>
          </td>
          <td className="hidden md:table-cell px-3 py-3 text-xs text-neutral-600">
            {CATEGORY_LABELS[prospect.business_category] || '—'}
          </td>
          <td className="hidden lg:table-cell px-3 py-3">
            <ScoreBar score={prospect.digital_maturity_score} />
          </td>
          <td className="px-3 py-3"><StatusChip status={prospect.funnel_status} /></td>
          <td className="hidden md:table-cell px-3 py-3 text-xs text-neutral-500">
            {prospect.email ? <span className="text-green-600">✓</span> : <span className="text-neutral-300">—</span>}
            {prospect.phone && <span className="ml-2 text-green-600">☎</span>}
          </td>
        </tr>
      );
    }

    function ProspectModal({ prospect, onClose, onUpdate }) {
      const [saving, setSaving] = useState(false);
      const [notes, setNotes] = useState(prospect.notes || '');
      const [status, setStatus] = useState(prospect.funnel_status);

      async function save() {
        setSaving(true);
        try {
          await supabaseFetch(`prospects_consulting?id=eq.${prospect.id}`, {
            method: 'PATCH',
            headers: { Prefer: 'return=minimal' },
            body: JSON.stringify({ notes, funnel_status: status })
          });
          onUpdate();
          onClose();
        } catch(e) { alert('Erreur: ' + e.message); }
        setSaving(false);
      }

      return (
        <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" onClick={onClose}>
          <div onClick={e => e.stopPropagation()} className="bg-white w-full sm:max-w-2xl sm:rounded-2xl rounded-t-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white/95 backdrop-blur border-b border-neutral-100 px-5 py-4 flex items-center justify-between">
              <div className="min-w-0">
                <div className="display-serif text-xl font-medium truncate">{prospect.business_name}</div>
                <div className="text-xs text-neutral-500">{prospect.city || '—'} · {CATEGORY_LABELS[prospect.business_category]}</div>
              </div>
              <button onClick={onClose} className="w-9 h-9 rounded-full hover:bg-neutral-100 flex items-center justify-center text-neutral-500">✕</button>
            </div>

            <div className="p-5 space-y-5">
              {/* Contacts */}
              <div>
                <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-2">Contact</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                  <div className="flex items-center gap-2"><span className="text-neutral-400 w-5">@</span> {prospect.email || <span className="text-neutral-300">—</span>}</div>
                  <div className="flex items-center gap-2"><span className="text-neutral-400 w-5">☎</span> {prospect.phone || <span className="text-neutral-300">—</span>}</div>
                  <div className="flex items-center gap-2"><span className="text-neutral-400 w-5">🌐</span> {prospect.website_url ? <a href={prospect.website_url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline truncate">{prospect.website_url}</a> : <span className="text-neutral-300">—</span>}</div>
                  <div className="flex items-center gap-2"><span className="text-neutral-400 w-5">📍</span> <span className="truncate">{prospect.address || '—'}</span></div>
                </div>
              </div>

              {/* Score + Google */}
              <div className="grid grid-cols-2 gap-3">
                <div className="card p-3">
                  <div className="text-[10px] uppercase tracking-wider text-neutral-400">Maturité digitale</div>
                  <div className="mt-1"><ScoreBar score={prospect.digital_maturity_score} /></div>
                </div>
                <div className="card p-3">
                  <div className="text-[10px] uppercase tracking-wider text-neutral-400">Google</div>
                  <div className="mt-1 text-sm tabular-nums">{prospect.google_rating ? `⭐ ${prospect.google_rating}` : '—'} <span className="text-neutral-400 text-xs">({prospect.google_reviews_count || 0} avis)</span></div>
                </div>
              </div>

              {/* Angle de prospection */}
              {prospect.prospection_angle && (
                <div className="card p-4 bg-amber-50 border-amber-200">
                  <div className="text-[11px] uppercase tracking-wider text-amber-700 font-medium">Angle de prospection IA</div>
                  <div className="text-sm mt-1 text-neutral-800">{prospect.prospection_angle}</div>
                </div>
              )}

              {/* Faiblesses détectées */}
              {prospect.digital_weaknesses && prospect.digital_weaknesses.length > 0 && (
                <div>
                  <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-2">Faiblesses détectées</div>
                  <div className="flex flex-wrap gap-1.5">
                    {prospect.digital_weaknesses.map((w, i) => (
                      <span key={i} className="chip bg-red-50 text-red-700">{w.replace(/_/g, ' ')}</span>
                    ))}
                  </div>
                </div>
              )}

              {/* Status update */}
              <div>
                <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-2">Statut funnel</div>
                <select value={status} onChange={e => setStatus(e.target.value)} className="w-full border border-neutral-200 rounded-lg px-3 py-2 text-sm bg-white">
                  {Object.entries(STATUS_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                </select>
              </div>

              {/* Emails générés */}
              {[1, 2, 3].map(n => prospect[`email_${n}_body`] && (
                <div key={n} className="card p-4">
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium">Email {n}</div>
                    {prospect[`email_${n}_sent_at`] && <span className="text-[10px] text-green-600">✓ Envoyé</span>}
                  </div>
                  <div className="font-medium text-sm">{prospect[`email_${n}_subject`]}</div>
                  <div className="text-xs text-neutral-600 mt-2 whitespace-pre-wrap">{prospect[`email_${n}_body`]}</div>
                </div>
              ))}

              {/* Notes */}
              <div>
                <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-2">Notes</div>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} className="w-full border border-neutral-200 rounded-lg px-3 py-2 text-sm resize-none" placeholder="Notes internes..."/>
              </div>

              {/* Actions */}
              <div className="flex flex-col sm:flex-row gap-2 pt-2">
                {prospect.google_maps_url && <a href={prospect.google_maps_url} target="_blank" rel="noreferrer" className="flex-1 text-center border border-neutral-200 rounded-lg px-4 py-2.5 text-sm hover:bg-neutral-50">Voir sur Google Maps</a>}
                {prospect.website_url && <a href={prospect.website_url} target="_blank" rel="noreferrer" className="flex-1 text-center border border-neutral-200 rounded-lg px-4 py-2.5 text-sm hover:bg-neutral-50">Visiter le site</a>}
                <button onClick={save} disabled={saving} className="flex-1 btn-primary rounded-lg px-4 py-2.5 text-sm font-medium disabled:opacity-60">{saving ? 'Sauvegarde…' : 'Enregistrer'}</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [prospects, setProspects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [selectedProspect, setSelectedProspect] = useState(null);
      const [tab, setTab] = useState('list');

      async function load() {
        setLoading(true);
        try {
          const data = await supabaseFetch('prospects_consulting?select=*&order=updated_at.desc&limit=500');
          setProspects(data || []);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      useEffect(() => { load(); }, []);

      const stats = useMemo(() => {
        const total = prospects.length;
        const withEmail = prospects.filter(p => p.email).length;
        const enriched = prospects.filter(p => p.digital_maturity_score != null).length;
        const sent = prospects.filter(p => p.email_1_sent_at).length;
        const opened = prospects.filter(p => p.email_1_opened_at || p.email_2_opened_at || p.email_3_opened_at).length;
        const replied = prospects.filter(p => p.funnel_status === 'replied' || p.funnel_status === 'call_booked' || p.funnel_status === 'client').length;
        const clients = prospects.filter(p => p.funnel_status === 'client').length;

        const openRate = sent > 0 ? (opened / sent) * 100 : 0;
        const replyRate = sent > 0 ? (replied / sent) * 100 : 0;
        const convRate = sent > 0 ? (clients / sent) * 100 : 0;

        return { total, withEmail, enriched, sent, opened, replied, clients, openRate, replyRate, convRate };
      }, [prospects]);

      const filtered = useMemo(() => {
        return prospects.filter(p => {
          if (filterCategory !== 'all' && p.business_category !== filterCategory) return false;
          if (filterStatus !== 'all' && p.funnel_status !== filterStatus) return false;
          if (search) {
            const q = search.toLowerCase();
            return (p.business_name || '').toLowerCase().includes(q)
              || (p.city || '').toLowerCase().includes(q)
              || (p.email || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [prospects, filterCategory, filterStatus, search]);

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="border-b border-neutral-100 bg-white/80 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
              <div>
                <div className="display-serif text-xl sm:text-2xl font-medium">RobinAI Consulting</div>
                <div className="text-xs text-neutral-500">Prospection nautique FR</div>
              </div>
              <button onClick={load} className="text-xs px-3 py-1.5 rounded-full border border-neutral-200 hover:bg-neutral-50">Actualiser</button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {/* Tabs */}
            <div className="flex gap-1 mb-6 overflow-x-auto -mx-1 px-1">
              {['list', 'funnel', 'stats'].map(t => (
                <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${tab === t ? 'tab-active' : 'text-neutral-600 hover:bg-neutral-100'}`}>
                  {t === 'list' ? 'Prospects' : t === 'funnel' ? 'Funnel' : 'Statistiques'}
                </button>
              ))}
            </div>

            {/* KPI Grid - always visible */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
              <KPICard label="Prospects" value={stats.total} sublabel={`${stats.withEmail} avec email`} />
              <KPICard label="Enrichis IA" value={stats.enriched} sublabel={`${stats.total ? ((stats.enriched / stats.total) * 100).toFixed(0) : 0}%`} />
              <KPICard label="Emails envoyés" value={stats.sent} sublabel={`${stats.opened} ouverts`} accent="var(--amber)" />
              <KPICard label="Conversions" value={stats.clients} sublabel={`${stats.convRate.toFixed(1)}% conv.`} accent="var(--green)" />
            </div>

            {tab === 'list' && (
              <>
                {/* Filters */}
                <div className="card p-3 sm:p-4 mb-4 flex flex-col sm:flex-row gap-2">
                  <input type="text" placeholder="Rechercher nom, ville, email…" value={search} onChange={e => setSearch(e.target.value)} className="flex-1 px-3 py-2 text-sm border border-neutral-200 rounded-lg" />
                  <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)} className="px-3 py-2 text-sm border border-neutral-200 rounded-lg bg-white">
                    <option value="all">Toutes catégories</option>
                    {Object.entries(CATEGORY_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                  <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="px-3 py-2 text-sm border border-neutral-200 rounded-lg bg-white">
                    <option value="all">Tous statuts</option>
                    {Object.entries(STATUS_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                </div>

                {/* Table */}
                <div className="card overflow-hidden">
                  {loading ? (
                    <div className="p-12 text-center text-neutral-400 text-sm">Chargement…</div>
                  ) : filtered.length === 0 ? (
                    <div className="p-12 text-center">
                      <div className="display-serif text-xl font-light text-neutral-500">Aucun prospect</div>
                      <div className="text-xs text-neutral-400 mt-2">Lance le workflow n8n pour scraper ta 1ère fournée</div>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead className="bg-neutral-50/50 border-b border-neutral-100">
                          <tr className="text-[10px] uppercase tracking-wider text-neutral-500 font-medium">
                            <th className="text-left px-3 sm:px-4 py-3">Entreprise</th>
                            <th className="hidden md:table-cell text-left px-3 py-3">Catégorie</th>
                            <th className="hidden lg:table-cell text-left px-3 py-3">Maturité</th>
                            <th className="text-left px-3 py-3">Statut</th>
                            <th className="hidden md:table-cell text-left px-3 py-3">Contact</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filtered.map(p => <ProspectRow key={p.id} prospect={p} onOpen={setSelectedProspect} />)}
                        </tbody>
                      </table>
                    </div>
                  )}
                  <div className="px-4 py-3 border-t border-neutral-100 text-xs text-neutral-400 tabular-nums">
                    {filtered.length} / {prospects.length} prospects
                  </div>
                </div>
              </>
            )}

            {tab === 'funnel' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-6 gap-2">
                  <FunnelStep label="Scrapés" count={stats.total} pct={100} />
                  <FunnelStep label="Enrichis" count={stats.enriched} pct={stats.total ? (stats.enriched / stats.total) * 100 : 0} />
                  <FunnelStep label="Emails E1" count={stats.sent} pct={stats.total ? (stats.sent / stats.total) * 100 : 0} />
                  <FunnelStep label="Ouverts" count={stats.opened} pct={stats.total ? (stats.opened / stats.total) * 100 : 0} />
                  <FunnelStep label="Répondus" count={stats.replied} pct={stats.total ? (stats.replied / stats.total) * 100 : 0} />
                  <FunnelStep label="Clients" count={stats.clients} pct={stats.total ? (stats.clients / stats.total) * 100 : 0} />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="card p-4">
                    <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium">Taux d'ouverture</div>
                    <div className="display-serif text-3xl font-light mt-1 tabular-nums">{stats.openRate.toFixed(1)}<span className="text-lg text-neutral-400">%</span></div>
                    <div className="text-xs text-neutral-400 mt-1">{stats.opened} / {stats.sent} emails</div>
                  </div>
                  <div className="card p-4">
                    <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium">Taux de réponse</div>
                    <div className="display-serif text-3xl font-light mt-1 tabular-nums" style={{ color: 'var(--amber)' }}>{stats.replyRate.toFixed(1)}<span className="text-lg text-neutral-400">%</span></div>
                    <div className="text-xs text-neutral-400 mt-1">{stats.replied} / {stats.sent} emails</div>
                  </div>
                  <div className="card p-4">
                    <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium">Conversion</div>
                    <div className="display-serif text-3xl font-light mt-1 tabular-nums" style={{ color: 'var(--green)' }}>{stats.convRate.toFixed(1)}<span className="text-lg text-neutral-400">%</span></div>
                    <div className="text-xs text-neutral-400 mt-1">{stats.clients} client(s)</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'stats' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Par catégorie */}
                <div className="card p-5">
                  <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-3">Par catégorie</div>
                  <div className="space-y-2.5">
                    {Object.entries(CATEGORY_LABELS).map(([k, label]) => {
                      const count = prospects.filter(p => p.business_category === k).length;
                      const pct = stats.total ? (count / stats.total) * 100 : 0;
                      return (
                        <div key={k}>
                          <div className="flex justify-between text-xs mb-1">
                            <span className="text-neutral-600">{label}</span>
                            <span className="tabular-nums text-neutral-500">{count} <span className="text-neutral-300">· {pct.toFixed(0)}%</span></span>
                          </div>
                          <div className="h-1.5 bg-neutral-100 rounded-full overflow-hidden">
                            <div className="h-full bg-neutral-900" style={{ width: `${pct}%` }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Par ville */}
                <div className="card p-5">
                  <div className="text-[11px] uppercase tracking-wider text-neutral-500 font-medium mb-3">Top villes</div>
                  <div className="space-y-2.5">
                    {Object.entries(prospects.reduce((acc, p) => { const c = p.city || 'Inconnu'; acc[c] = (acc[c] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([city, count]) => {
                      const pct = stats.total ? (count / stats.total) * 100 : 0;
                      return (
                        <div key={city}>
                          <div className="flex justify-between text-xs mb-1">
                            <span className="text-neutral-600 truncate">{city}</span>
                            <span className="tabular-nums text-neutral-500">{count}</span>
                          </div>
                          <div className="h-1.5 bg-neutral-100 rounded-full overflow-hidden">
                            <div className="h-full" style={{ width: `${pct}%`, background: 'var(--accent)' }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </main>

          {selectedProspect && (
            <ProspectModal prospect={selectedProspect} onClose={() => setSelectedProspect(null)} onUpdate={load} />
          )}

          <footer className="max-w-7xl mx-auto px-4 sm:px-6 py-8 text-center text-xs text-neutral-400">
            RobinAI Consulting · Dashboard prospection nautique
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
